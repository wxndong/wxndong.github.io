<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Academic homepage of {{ site.data.profile.primary_name }}">
    <title>{{ page.title }} - {{ site.data.profile.primary_name }}</title>
    <link rel="icon" type="image/jpeg" sizes="400x400" href="{{ '/assets/icon/icon.jpg' | relative_url }}">
    {% if jekyll.environment == 'preview' %}
    <meta name="robots" content="noindex, nofollow">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}?v=7">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include navbar.html %}
    <main class="shell" id="main" tabindex="-1">
        {{ content }}
    </main>
    {% include footer.html %}
    <script defer src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/reading-progress.js' | relative_url }}"></script>
</body>
</html>
