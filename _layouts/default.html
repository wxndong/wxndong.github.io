<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Academic homepage of {{ site.data.profile.primary_name }}">
    <title>{{ page.title }} - {{ site.data.profile.primary_name }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icon/icon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            var savedTheme = localStorage.getItem("theme");
            if (savedTheme === "light" || savedTheme === "dark") {
                document.documentElement.setAttribute("data-theme", savedTheme);
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body>
    {% include navbar.html %}
    <main class="site-shell">
        {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
