<nav class="top-nav" aria-label="Primary navigation">
    <div class="top-nav-inner">
        <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
        <div class="nav-actions">
            {% for item in site.data.navigation.pages %}
            <a href="{{ item.url | relative_url }}" {% if item.name == page.navbar_title %}class="active"{% endif %}>
                {{ item.name }}
            </a>
            {% endfor %}
            <button class="theme-toggle" type="button" aria-label="Toggle color mode" aria-pressed="false" title="Change theme">
                <i class="fa-solid fa-moon"></i>
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
    </div>
</nav>
