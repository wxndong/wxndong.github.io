<header class="site-header">
    <nav class="navigation shell" aria-label="Primary navigation">
        <div class="nav-social" role="group" aria-label="Contact and profiles">
            <a href="mailto:{{ site.data.profile.email }}" aria-label="Email" title="Email">
                {% include nav-icons/envelope.svg %}
            </a>
            <span role="link" aria-disabled="true" aria-label="Google Scholar" title="Google Scholar">
                {% include nav-icons/google-scholar.svg %}
            </span>
            <a href="https://github.com/{{ site.data.profile.github }}" target="_blank" rel="noreferrer" aria-label="GitHub" title="GitHub">
                {% include nav-icons/github.svg %}
            </a>
            <span role="link" aria-disabled="true" aria-label="X" title="X">
                {% include nav-icons/x-twitter.svg %}
            </span>
        </div>
        <div class="nav-links">
            <a href="{{ '/#about' | relative_url }}">About</a>
            {% if site.data.display.homepage.show_selected_publications %}
            <a href="{{ '/#research' | relative_url }}">Research</a>
            {% endif %}
            {% if site.data.profile.cv_link %}
            <a href="{{ site.data.profile.cv_link | relative_url }}" target="_blank" rel="noreferrer">CV</a>
            {% endif %}
        </div>
        <button class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false" title="Switch color theme">
            <span class="light-icon" aria-hidden="true">{% include nav-icons/moon.svg %}</span>
            <span class="dark-icon" aria-hidden="true">{% include nav-icons/sun.svg %}</span>
        </button>
    </nav>
    <progress class="reading-progress" max="1" value="0" aria-hidden="true"></progress>
</header>
