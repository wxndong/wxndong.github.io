short_bio: >-
  <p>
    I am an M.S. student at <a href="https://www.shanghaitech.edu.cn/" target="_blank" rel="noreferrer">ShanghaiTech University</a>, advised by <a href="https://true-genghao.github.io/genghao/" target="_blank" rel="noreferrer">Prof. Hao Geng</a>. Prior to that, I received my B.Eng. degree in Computer Science from <a href="https://www.nefu.edu.cn/" target="_blank" rel="noreferrer">Northeast Forestry University</a>.
  </p>
  <p>My research interests include:</p>
  <ul class="interest-list">
    <li><strong>Agentic AI</strong>, with a focus on agentic post-training, reasoning-centric reinforcement learning, and self-improving agents.</li>
    <li><strong>Multimodal Large Language Models (MLLMs)</strong>, with a focus on multimodal reasoning, generation, and world understanding.</li>
    <li><strong>AI for EDA</strong>, with a focus on large models for efficient, accurate, and automated EDA workflows.</li>
  </ul>


