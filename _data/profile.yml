short_bio: >-
  <p>I am an M.S. student at <a href="https://www.shanghaitech.edu.cn/" rel="noreferrer">ShanghaiTech University</a>, advised by <a href="https://true-genghao.github.io/genghao/" rel="noreferrer">Prof. Hao Geng</a>. Before that, I earned my B.Eng. in Computer Science from <a href="https://www.nefu.edu.cn/" rel="noreferrer">Northeast Forestry University</a>.</p>
  <p>My research spans <strong>Agentic AI, Multimodal LLMs, and their applications in EDA</strong>. I focus on recursive self-improvement, agentic post-training, and personal agents.</p>
  <p>I believe agents can learn to solve anything. What they learn through use should accumulate into lasting capabilities they can build on and apply to new tasks in both the digital and physical worlds. As people's goals change, how should agents decide what is worth learning next and which earlier lessons need updating?</p>

